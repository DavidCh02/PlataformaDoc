# PlataformaDoc (Laravel) — sitio principal (docs.despacho.com)
# Asume PHP-FPM 8.3 instalado y el proyecto en /var/www/PlataformaDoc.
# El bloque "80 → 443" lo genera certbot --nginx.

server {
    listen 80;
    server_name docs.despacho.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name docs.despacho.com;

    root /var/www/PlataformaDoc/public;

    ssl_certificate     /etc/letsencrypt/live/docs.despacho.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.despacho.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    index index.php;
    charset utf-8;
    client_max_body_size 40m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Evitar servir archivos de configuración/dotfiles
    location ~ /\.(?!well-known).* { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Cachear assets compilados por Vite
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}