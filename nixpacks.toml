# Railway / Nixpacks: build y arranque de PlataformaDoc (Laravel 12 + Vite).
[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "nodejs_22", "chromium"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction --no-progress",
  "npm ci --no-audit --no-fund"
]

[phases.build]
cmds = ["npm run build"]

# BROWSERSHOT_CHROME_PATH se resuelve en arranque (en NixOS no hay /usr/bin).
# Requiere la variable $PORT que inyecta Railway. No fijar PORT manualmente.
[start]
cmd = "export BROWSERSHOT_CHROME_PATH=$(which chromium) && php artisan migrate --force && php artisan optimize && php artisan serve --host=0.0.0.0 --port=$PORT"
